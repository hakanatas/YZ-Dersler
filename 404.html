<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı — YZ Dersler</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/YZ-Dersler/assets/favicon.svg" type="image/svg+xml" />

    @font-face { font-family: 'Instrument Sans'; src: url('/YZ-Dersler/assets/fonts/InstrumentSans-Variable.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }

    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(32px, 7vw, 52px); margin: 0 0 10px; }
    p { font-size: 18px; color: #6b5a4d; max-width: 36ch; margin: 0 auto 22px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #c4623d; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Bu mantı masada yok!</h1>
    <p>Aradığın sayfayı bulamadık. Belki adres değişti; bütün dersler ana sayfada.</p>
